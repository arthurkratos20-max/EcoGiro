<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie sua conta | EcoGiro</title><link rel="stylesheet" href="assets/css/login.css"><script src="assets/js/auth.js" defer></script><script src="assets/js/cadastro.js" defer></script></head><body><main class="login-page"><a class="brand" href="index.htm">EcoGiro</a><section class="login-card"><div class="login-heading"><h1>Crie sua conta</h1></div><form id="register-form"><div class="input-group"><label for="name">Nome</label><input id="name" name="name" autocomplete="name" required maxlength="100"></div><div class="input-group"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="input-group"><label for="password">Senha (mínimo de 8 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div><div class="input-group"><label for="confirm">Confirme a senha</label><input id="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div><p id="auth-message" role="status" aria-live="polite"></p><button class="submit-button" type="submit">Cadastrar</button></form><p class="signup-note">Já tem conta? <a href="login.html">Entrar</a></p></section></main></body></html>
