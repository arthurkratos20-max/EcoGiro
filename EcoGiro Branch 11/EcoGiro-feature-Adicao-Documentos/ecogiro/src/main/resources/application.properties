spring.application.name=ecogiro
server.port=${PORT:8080}

# Local: H2 persistente. Produção (Neon/Render): definir SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ecogiro;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Segurança: console H2 desabilitado por padrão. Habilite explicitamente apenas no
# desenvolvimento local, se necessário, com SPRING_H2_CONSOLE_ENABLED=true.
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Não existe código de cadastro administrativo padrão. Configure ADMIN_REGISTRATION_CODE
# no ambiente local/servidor para habilitar o fluxo protegido de cadastro administrativo.
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:}
