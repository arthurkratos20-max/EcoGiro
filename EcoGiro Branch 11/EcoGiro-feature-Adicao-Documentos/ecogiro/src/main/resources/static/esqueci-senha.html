<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16863d">
    <title>Recuperar senha | EcoGiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">
    <script src="assets/js/password-reset.js" defer></script>
</head>
<body data-area="usuario">
<main class="login-page">
    <a class="brand" href="index.html"><img src="assets/img/icone.svg" alt=""><span>Eco<span class="brand-accent">Giro</span></span></a>
    <section class="login-card" aria-labelledby="reset-title">
        <div class="login-heading">
            <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>
            <h1 id="reset-title">Esqueceu sua senha?</h1>
            <p>Informe o e-mail cadastrado. Se houver uma conta associada, enviaremos um link para criar uma nova senha.</p>
        </div>
        <div id="feedback" class="auth-feedback" role="status" aria-live="polite" hidden></div>
        <form action="/forgot-password" method="post">
            <div class="input-group">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="180" required>
            </div>
            <button class="submit-button" type="submit">Enviar link de recuperação</button>
        </form>
        <a class="back-home" href="login.html">← Voltar para o login</a>
    </section>
    <p class="page-footer">© 2026 EcoGiro. Mobilidade mais leve para a cidade.</p>
</main>
</body>
</html>
